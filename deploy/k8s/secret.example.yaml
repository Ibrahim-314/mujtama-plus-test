# EXAMPLE ONLY — not part of kustomization. Create the real Secret out of band:
#   kubectl -n mujtama create secret generic mujtama-secrets --from-literal=DATABASE_URL=... --from-literal=REDIS_URL=... \
#     --from-literal=NATS_URL=... --from-literal=PI_API_KEY=...
apiVersion: v1
kind: Secret
metadata:
  name: mujtama-secrets
type: Opaque
stringData:
  DATABASE_URL: "postgres://USER:PASSWORD@pgbouncer:6432/mujtama"
  REDIS_URL: "redis://:PASSWORD@redis:6379/0"
  NATS_URL: "nats://nats:4222"
